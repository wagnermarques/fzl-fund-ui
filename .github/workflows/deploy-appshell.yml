# ==============================================================================
# PIPELINE DE DEPLOY & ROLLBACK — APPSHELL (GITHUB PAGES)
# ==============================================================================
# Publica o appshell (appshell-lit/) no GitHub Pages:
# URL Pública: https://wagnermarques.github.io/fzl-fund-ui/
#
# ------------------------------------------------------------------------------
# ESTRATÉGIA DE BRANCHES & RELEASE:
# ------------------------------------------------------------------------------
# - 'release': Branch estável representando a versão homologada de produção.
#              Sempre que uma release for mesclada ou enviada, o deploy roda automaticamente.
# - 'main':    Branch de desenvolvimento contínuo. Novos commits disparam deploy para
#              validação no ar.
#
# ------------------------------------------------------------------------------
# PLANO DE CONTINGÊNCIA / REDEPLOY DE EMERGÊNCIA (ROLLBACK EM 1 CLIQUE):
# ------------------------------------------------------------------------------
# Se um deploy recente da 'main' quebrar ou desestabilizar a aplicação no ar,
# você pode redeployar a branch 'release' estável imediatamente:
#
# OPÇÃO 1 — Pelo Navegador (GitHub Actions Web UI):
#   1. Acesse: Repositório -> Actions -> "Deploy appshell (GitHub Pages)"
#   2. Clique no botão "Run workflow" (canto superior direito).
#   3. No seletor "target_ref", selecione: 'release'.
#   4. Clique no botão verde "Run workflow".
#      O GitHub Actions recompila a release estável e sobrepõe o ar em ~1 minuto.
#
# OPÇÃO 2 — Pelo Terminal (GitHub CLI):
#   gh workflow run deploy-appshell.yml -f target_ref=release
# ==============================================================================
name: Deploy appshell (GitHub Pages)

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch ou tag para deploy/rollback no GitHub Pages'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Faz checkout da branch escolhida manualmente no dispatch (ex: rollback para 'release')
      # ou da branch disparada no evento de push.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compila os web components consumidos pelo appshell antes do build final
      - name: Build web components
        run: npm run build:tokens && npm run build:es6 && npm run build:lit && npm run build:angular

      # Quality Gate: impede deploy caso os testes unitários do appshell quebrem
      - name: Test appshell
        run: npm test --workspace=fzl-fund-appshell--lit

      # O Pages serve em /<repo>/, daí o --base. Variáveis vazias são ignoradas
      # pelo appshell (ver src/app-config.js); defina-as em Settings -> Secrets and variables -> Actions -> Variables.
      - name: Build appshell (PWA estático)
        env:
          VITE_APPSHELL_TITLE: ${{ vars.VITE_APPSHELL_TITLE }}
          VITE_APPSHELL_BACKENDS_API_URL: ${{ vars.VITE_APPSHELL_BACKENDS_API_URL }}
          VITE_APPSHELL_ANALYTICS_ID: ${{ vars.VITE_APPSHELL_ANALYTICS_ID }}
          VITE_APPSHELL_PUSH_VAPID_PUBLIC_KEY: ${{ vars.VITE_APPSHELL_PUSH_VAPID_PUBLIC_KEY }}
        run: npm run build --workspace=fzl-fund-appshell--lit -- --base=/${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./appshell-lit/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
